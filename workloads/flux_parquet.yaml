# Flux B200 Workload - Optimized Parquet
# Scaled to fit in 512GB NVMe storage
#
# Original: 4296 files, 288 samples/file, ~2.68 TB total
# Scaled:   150 files, 288 samples/file, ~93 GB total

model:
  name: flux_parquet

framework: pytorch

workflow:
  generate_data: True
  train: True
  checkpoint: False

dataset:
  data_folder: /home/developer/workspace/nvme/flux_parquet/
  format: parquet
  compression: none
  num_files_train: 150
  num_samples_per_file: 288
  record_length: 2164832

  parquet:
    row_group_size: 48
    memory_map: true
    use_threads: true
    metadata_cache: true
    row_group_cache_size: 4

    columns:
      - name: t5_encodings
        dtype: float32
        size: 524328
      - name: clip_encodings
        dtype: float32
        size: 409
      - name: mean
        dtype: float32
        size: 8232
      - name: logvar
        dtype: float32
        size: 8232
      - name: timestamp
        dtype: float32
        size: 7

reader:
  data_loader: pytorch
  batch_size: 48
  read_threads: 8
  file_shuffle: seed

train:
  epochs: 1
  computation_time: 1.35

metric:
  au: 0.90
